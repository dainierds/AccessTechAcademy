<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" class="von-duprin-crashbar-svg">
  <defs>
    <!-- Satin Stainless Steel & Brushed Aluminum Gradients -->
    <linearGradient id="cb-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="cb-pushpad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f1f5f9" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="cb-rail-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="cb-latch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cb-metal-screw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Filters for Depth & Shadows -->
    <filter id="cb-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="cb-pad-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="cb-led-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Reusable Allen Screw -->
    <g id="cb-allen-screw">
      <circle cx="0" cy="0" r="7" fill="url(#cb-metal-screw)" stroke="#475569" stroke-width="1" />
      <polygon points="0,-3.5 3,-1.8 3,1.8 0,3.5 -3,1.8 -3,-1.8" fill="#1e293b" />
    </g>

    <!-- Reusable Terminal Pin (+ / - Power) -->
    <g id="cb-terminal-node">
      <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0b1329" stroke-width="2.5" />
      <circle cx="0" cy="0" r="11" fill="url(#cb-metal-screw)" stroke="#334155" stroke-width="1" />
      <circle cx="0" cy="0" r="6" fill="#0b1329" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
      <line x1="-4" y1="-2" x2="4" y2="2" stroke="#f8fafc" stroke-width="1.2" />
      <line x1="-2" y1="4" x2="2" y2="-4" stroke="#f8fafc" stroke-width="1.2" />
    </g>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="1000" height="420" fill="#0b1329" rx="16" />

  <!-- ================================================================= -->
  <!-- MAIN CRASHBAR ASSEMBLY (VON DUPRIN 75 / 99 SERIES ELECTRIFIED)    -->
  <!-- ================================================================= -->
  <g filter="url(#cb-shadow)" transform="translate(45, 60)" id="crashbar-mechanism-assembly">
    
    <!-- ------------------------------------------------------------- -->
    <!-- 1. LATCH BOLT (PESTILLO RETRÁCTIL - IZQUIERDA)                -->
    <!-- ------------------------------------------------------------- -->
    <g id="cb-latch-bolt" transform="translate(0, 0)">
      <!-- Main Hardened Steel Latch -->
      <path d="M 38 100 L 8 110 L 8 145 L 38 155 Z" fill="url(#cb-latch-grad)" stroke="#0f172a" stroke-width="1.5" />
      <!-- Beveled Latch Bevel Lip -->
      <path d="M 8 110 L 2 114 L 2 141 L 8 145 Z" fill="#475569" />
      <!-- Latch Deadlocking Trigger Auxiliary Pin -->
      <rect x="18" y="158" width="16" height="12" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 2. MAIN BASE EXTRUDED RAIL (CUERPO GUÍA METÁLICO)             -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(130, 48)">
      <!-- Base Channel Rail -->
      <rect x="0" y="0" width="720" height="74" rx="3" fill="url(#cb-rail-grad)" stroke="#475569" stroke-width="1.5" />
      
      <!-- Top Rail Lip Highlight -->
      <line x1="0" y1="2" x2="720" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
      <line x1="0" y1="8" x2="720" y2="8" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
      <!-- Bottom Rail Shadow Groove -->
      <line x1="0" y1="72" x2="720" y2="72" stroke="#334155" stroke-width="1.5" />

      <!-- Dogging / Hex Key Access Port (Right end) -->
      <circle cx="505" cy="46" r="4.5" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <circle cx="505" cy="46" r="2.5" fill="#1e293b" />
    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 3. PUSH PAD TOUCHBAR (BARRA DE EMPUJE FRONTAL RETRÁCTIL)      -->
    <!-- ------------------------------------------------------------- -->
    <g id="cb-pushpad-group" filter="url(#cb-pad-shadow)" transform="translate(135, 62)">
      <!-- Pushpad Left Return Hinge Cap -->
      <path d="M 12 0 L 24 0 L 24 82 L 12 82 A 6 6 0 0 1 6 76 L 6 6 A 6 6 0 0 1 12 0 Z" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      
      <!-- Main Touchpad Surface (Smooth Cylindrical Brushed Metal) -->
      <rect x="24" y="0" width="460" height="82" rx="4" fill="url(#cb-pushpad-grad)" stroke="#334155" stroke-width="1.2" />
      
      <!-- Curved Reflection Highlights on Touchbar -->
      <path d="M 24 2 L 484 2 L 484 14 L 24 14 Z" fill="#ffffff" opacity="0.8" />
      <line x1="24" y1="22" x2="484" y2="22" stroke="#ffffff" stroke-width="0.8" opacity="0.5" />
      <line x1="24" y1="64" x2="484" y2="64" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
      <line x1="24" y1="80" x2="484" y2="80" stroke="#475569" stroke-width="1.5" />

      <!-- Pushpad Right Flush End Return -->
      <path d="M 484 0 L 490 0 A 4 4 0 0 1 494 4 L 494 78 A 4 4 0 0 1 490 82 L 484 82 Z" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      
      <!-- Touchpad Center Grip Subtle Texturing -->
      <text x="254" y="46" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#475569" opacity="0.6" letter-spacing="4" text-anchor="middle">PUSH TO EXIT</text>
    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 4. HEAD MECHANISM HOUSING (CABEZAL MECÁNICO IZQUIERDO)        -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(30, 0)">
      <!-- Main Beveled Head Case -->
      <path d="M 12 28 A 12 12 0 0 1 24 16 L 90 16 A 12 12 0 0 1 102 28 L 114 96 L 102 216 A 12 12 0 0 1 90 228 L 24 228 A 12 12 0 0 1 12 216 Z" fill="url(#cb-head-grad)" stroke="#334155" stroke-width="2" />
      
      <!-- Beveled Inner Recess & Chamfers -->
      <path d="M 22 28 L 84 28 L 94 96 L 84 216 L 22 216 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
      <line x1="12" y1="124" x2="108" y2="124" stroke="#64748b" stroke-width="1.5" opacity="0.6" />

      <!-- Upper Head Mounting Allen Screw -->
      <use href="#cb-allen-screw" x="30" y="44" />
      <!-- Lower Head Mounting Allen Screw -->
      <use href="#cb-allen-screw" x="30" y="200" />

      <!-- Solenoid / QEL Motor Status LED (Electric Latch Retraction Active) -->
      <g transform="translate(74, 124)">
        <circle cx="0" cy="0" r="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4" fill="#22c55e" id="cb-el-led" filter="url(#cb-led-glow)" />
      </g>

      <!-- Head Mechanism Brand Stamp -->
      <text x="56" y="96" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">VON DUPRIN</text>
      <text x="56" y="108" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#334155" text-anchor="middle">75 / 99 SERIES</text>
      <text x="56" y="145" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#059669" text-anchor="middle" id="cb-status-text">LATCHED</text>
    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 5. END CAP BRACKET (TAPA TERMINAL DERECHA)                    -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(850, 44)">
      <!-- Beveled End Cap Body -->
      <path d="M 0 4 L 18 0 L 26 8 L 26 74 L 18 82 L 0 78 Z" fill="url(#cb-head-grad)" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="5" x2="18" y2="1" stroke="#ffffff" stroke-width="1" />
      <line x1="18" y1="0" x2="18" y2="82" stroke="#64748b" stroke-width="1" />
      <!-- End Cap Retaining Fastener -->
      <circle cx="10" cy="41" r="3.5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    </g>

  </g>

  <!-- ================================================================= -->
  <!-- 6. POWER CONNECTION TERMINALS (+ / - RED & BLACK POWER BORNES)    -->
  <!-- ================================================================= -->
  <!-- Wiring Connection Box Header -->
  <g transform="translate(340, 310)">
    <rect x="0" y="0" width="320" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="160" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">BORNES DE ALIMENTACIÓN EL / QEL</text>
    <text x="160" y="40" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">RETRACCIÓN ELÉCTRICA DE PESTILLO (24VDC / 12VDC)</text>
    <text x="160" y="54" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#22c55e" text-anchor="middle">FAIL-SECURE (PULSO = RETRACCIÓN / LIBERACIÓN)</text>
  </g>

  <!-- Terminal 1: POSITIVO (ROJO) +12V / +24VDC POWER -->
  <g class="cb-terminal" id="term-crashbar-pos" data-label="+ POWER (ROJO)" transform="translate(240, 343)">
    <use href="#cb-terminal-node" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7" />
    <text x="-26" y="6" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#ef4444" text-anchor="end">+</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ROJO (+PWR)</text>
  </g>

  <!-- Terminal 2: NEGATIVO (NEGRO) GND POWER -->
  <g class="cb-terminal" id="term-crashbar-neg" data-label="- GND (NEGRO)" transform="translate(760, 343)">
    <use href="#cb-terminal-node" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.7" />
    <text x="26" y="6" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#cbd5e1" text-anchor="start">-</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">NEGRO (GND)</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" class="maglock-svg">
  <defs>
    <!-- Brushed Aluminum & Steel Gradients -->
    <linearGradient id="ml-alum-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="15%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="ml-top-bracket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="ml-steel-pole-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="ml-dark-resin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="ml-metal-screw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bevel & Shadow Filters -->
    <filter id="ml-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="ml-led-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Phillips Faceplate Screw -->
    <g id="ml-phillips-screw">
      <circle cx="0" cy="0" r="10" fill="url(#ml-metal-screw)" stroke="#334155" stroke-width="1.2" />
      <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Wiring Simulator Screw Terminal (+ / -) -->
    <g id="ml-terminal-node">
      <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0b1329" stroke-width="2.5" />
      <circle cx="0" cy="0" r="11" fill="url(#ml-metal-screw)" stroke="#334155" stroke-width="1" />
      <circle cx="0" cy="0" r="6" fill="#0b1329" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
      <line x1="-4" y1="-2" x2="4" y2="2" stroke="#f8fafc" stroke-width="1.2" />
      <line x1="-2" y1="4" x2="2" y2="-4" stroke="#f8fafc" stroke-width="1.2" />
    </g>
  </defs>

  <!-- Dark Background Canvas (AccessLab Workbench Aesthetic) -->
  <rect width="960" height="380" fill="#0b1329" rx="16" />

  <!-- ================================================================= -->
  <!-- MAIN ELECTROMAGNETIC LOCK BODY (600 LBS FAIL-SAFE)                -->
  <!-- ================================================================= -->
  <g filter="url(#ml-shadow)" transform="translate(30, 45)">
    
    <!-- ------------------------------------------------------------- -->
    <!-- 1. TOP MOUNTING BRACKET / ARMATURE CHANNEL                    -->
    <!-- ------------------------------------------------------------- -->
    <!-- Top Bracket Base Plate -->
    <rect x="0" y="0" width="900" height="56" rx="4" fill="url(#ml-top-bracket-grad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Subtle Aluminum Brushed Horizontal Lines on Bracket -->
    <line x1="0" y1="12" x2="900" y2="12" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <line x1="0" y1="36" x2="900" y2="36" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
    <line x1="0" y1="55" x2="900" y2="55" stroke="#334155" stroke-width="1.5" />

    <!-- Mounting Holes & Wire Feed Channels (Matching Image Exactly) -->
    <!-- Left Hole Pair -->
    <circle cx="34" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="68" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    
    <!-- Oblong Cable / Mounting Slot 1 -->
    <rect x="110" y="16" width="70" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="114" y="20" width="62" height="12" rx="6" fill="#0b1329" />

    <!-- Center Left Oblong Hole -->
    <rect x="290" y="18" width="22" height="16" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2" />

    <!-- Center Countersink Hole -->
    <circle cx="430" cy="26" r="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    
    <!-- Large Oblong Center-Right Cable Slot -->
    <rect x="460" y="16" width="70" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="464" y="20" width="62" height="12" rx="6" fill="#0b1329" />

    <!-- Center Right Oblong Hole -->
    <rect x="560" y="18" width="22" height="16" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2" />

    <!-- Right Cable Entry Slot -->
    <rect x="660" y="16" width="38" height="20" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

    <!-- Right Mounting Hole Pair -->
    <circle cx="780" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="814" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- ------------------------------------------------------------- -->
    <!-- 2. MAIN LOCK CHASSIS (ALUMINUM HOUSING)                       -->
    <!-- ------------------------------------------------------------- -->
    <!-- Lower Body Base Rect -->
    <rect x="0" y="56" width="900" height="165" fill="url(#ml-alum-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Brushed Aluminum Surface Texture Reflections -->
    <line x1="0" y1="58" x2="900" y2="58" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
    <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff" stroke-width="0.5" opacity="0.4" />
    <line x1="0" y1="140" x2="900" y2="140" stroke="#f1f5f9" stroke-width="0.5" opacity="0.3" />
    <line x1="0" y1="220" x2="900" y2="220" stroke="#475569" stroke-width="1.5" />

    <!-- Left Enclosure Border Screws -->
    <use href="#ml-phillips-screw" x="18" y="140" />

    <!-- ------------------------------------------------------------- -->
    <!-- 3. ELECTROMAGNETIC CORE & STEEL POLE PIECES (LEFT 72% AREA)  -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(32, 68)">
      <!-- Outer Dark Epoxy Resin Bed Frame -->
      <rect x="0" y="0" width="620" height="142" rx="3" fill="url(#ml-dark-resin)" stroke="#020617" stroke-width="2" />
      
      <!-- Top Steel Pole Lip -->
      <rect x="38" y="10" width="544" height="16" fill="url(#ml-steel-pole-grad)" stroke="#1e293b" stroke-width="0.8" />
      <line x1="38" y1="12" x2="582" y2="12" stroke="#ffffff" stroke-width="1" />
      
      <!-- Upper Black Epoxy Insulation Gap -->
      <rect x="38" y="26" width="544" height="20" fill="url(#ml-dark-resin)" />
      
      <!-- Central High-Strength Electromagnetic Steel Core Face -->
      <rect x="38" y="46" width="544" height="50" fill="url(#ml-steel-pole-grad)" stroke="#1e293b" stroke-width="1" />
      <!-- Brushed Steel Highlights on Central Core -->
      <line x1="38" y1="50" x2="582" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
      <line x1="38" y1="71" x2="582" y2="71" stroke="#cbd5e1" stroke-width="0.8" opacity="0.6" />
      <line x1="38" y1="94" x2="582" y2="94" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" />
      
      <!-- Lower Black Epoxy Insulation Gap -->
      <rect x="38" y="96" width="544" height="20" fill="url(#ml-dark-resin)" />
      
      <!-- Bottom Steel Pole Lip -->
      <rect x="38" y="116" width="544" height="16" fill="url(#ml-steel-pole-grad)" stroke="#1e293b" stroke-width="0.8" />
      <line x1="38" y1="118" x2="582" y2="118" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 4. RIGHT COMPARTMENT: COVER PLATE, BRANDING & TERMINALS       -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(654, 56)">
      <!-- Right Housing Plate -->
      <rect x="0" y="0" width="246" height="165" fill="url(#ml-alum-grad)" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="165" stroke="#1e293b" stroke-width="2" />
      <line x1="2" y1="0" x2="2" y2="165" stroke="#ffffff" stroke-width="1" opacity="0.7" />

      <!-- Right Cover Mounting Screw -->
      <use href="#ml-phillips-screw" x="228" y="84" />

      <!-- ALARM CONTROLS Logo Waves Icon -->
      <g transform="translate(18, 52)">
        <path d="M 6 0 A 14 14 0 0 1 6 24" fill="none" stroke="#0b1329" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 12 4 A 9 9 0 0 1 12 20" fill="none" stroke="#0b1329" stroke-width="2.2" stroke-linecap="round" />
        <path d="M 18 8 A 4 4 0 0 1 18 16" fill="none" stroke="#0b1329" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Brand Typography (Matching Reference Exactly) -->
      <text x="44" y="58" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#0b1329" letter-spacing="1">ALARM</text>
      <text x="44" y="72" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" font-style="italic" fill="#0b1329" letter-spacing="1">CONTROLS</text>
      
      <!-- Divider Line -->
      <line x1="16" y1="84" x2="148" y2="84" stroke="#0b1329" stroke-width="1.2" />

      <!-- ASSA ABLOY Logo Text -->
      <text x="16" y="104" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="900" fill="#0b1329" letter-spacing="1.5">ASSA ABLOY</text>

      <!-- Tech Rating Silkscreen -->
      <text x="16" y="122" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#475569">600 LBS / 12-24VDC</text>
      <text x="16" y="136" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748b">FAIL-SAFE ELECTROMAGNETIC</text>

      <!-- Bond Status LED Indicator (Realtime Locked/Unlocked) -->
      <g transform="translate(182, 38)">
        <circle cx="0" cy="0" r="7" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4.5" fill="#22c55e" id="ml-bond-led" filter="url(#ml-led-glow)" />
        <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="800" fill="#0b1329" text-anchor="middle">STATUS</text>
      </g>
    </g>

  </g>

  <!-- ================================================================= -->
  <!-- 5. POWER CONNECTION TERMINALS (+ / - BORNES DE CONEXIÓN)          -->
  <!-- ================================================================= -->
  <!-- Wiring Connection Header Label Box (Door Controller / Lab Style) -->
  <g transform="translate(330, 290)">
    <rect x="0" y="0" width="300" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="150" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">BORNES DE ALIMENTACIÓN VDC</text>
    <text x="150" y="38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">FAIL-SAFE (12V = BLOQUEADO / 0V = LIBERADO)</text>
  </g>

  <!-- Terminal 1: POSITIVO (+) 12VDC / 24VDC -->
  <g class="ml-terminal" id="term-maglock-pos" data-label="+12V VCC" transform="translate(240, 319)">
    <use href="#ml-terminal-node" />
    <!-- Outer Red Accent Ring -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
    <text x="-28" y="6" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#ef4444" text-anchor="end">+</text>
    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">+12V / +24V</text>
  </g>

  <!-- Terminal 2: NEGATIVO (-) GND TIERRA -->
  <g class="ml-terminal" id="term-maglock-neg" data-label="GND (-)" transform="translate(720, 319)">
    <use href="#ml-terminal-node" />
    <!-- Outer Slate Accent Ring -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" />
    <text x="28" y="6" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#cbd5e1" text-anchor="start">-</text>
    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">GND (0V)</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="100%" height="100%" class="poe-switch-svg">
  <defs>
    <!-- Heavy-Duty Black Steel Enclosure Gradients -->
    <linearGradient id="poe-chassis-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="poe-chassis-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="15%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Bezel Edge Highlight -->
    <linearGradient id="poe-edge-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- RJ45 Shielded Metal Jack Gradients -->
    <linearGradient id="poe-rj45-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- RJ45 Cavity Depth -->
    <linearGradient id="poe-rj45-cavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="40%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Gold Pin Contact Gradients -->
    <linearGradient id="poe-gold-pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Red POE Accent Zone Gradient -->
    <linearGradient id="poe-red-banner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Drop Shadows & LED Glow -->
    <filter id="poe-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="poe-led-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- ============================================================= -->
    <!-- REUSABLE 8P8C RJ45 MODULAR ETHERNET PORT COMPONENT            -->
    <!-- ============================================================= -->
    <g id="poe-rj45-port">
      <!-- 1. Outer Metallic Shield Collar -->
      <rect x="-44" y="-38" width="88" height="76" rx="4" fill="url(#poe-rj45-shield)" stroke="#334155" stroke-width="1.5" />
      <!-- Ground Clip Indentations on Sides -->
      <path d="M -44 -16 L -40 -12 L -44 -8" stroke="#334155" stroke-width="1.2" fill="none" />
      <path d="M 44 -16 L 40 -12 L 44 -8" stroke="#334155" stroke-width="1.2" fill="none" />

      <!-- 2. Inner Deep Black Socket Cavity (Exact Keyed Modular Shape) -->
      <!-- Top wide chamber + Bottom stepped narrower latch slot -->
      <path d="
        M -38 -32 
        L 38 -32 
        L 38 12 
        L 26 12 
        L 26 30 
        L -26 30 
        L -26 12 
        L -38 12 Z" 
        fill="url(#poe-rj45-cavity)" stroke="#020617" stroke-width="1.5" />

      <!-- 3. Bottom Latch Retaining Side Steps (Clip Lock Ears) -->
      <rect x="-34" y="14" width="6" height="12" rx="1" fill="#1e293b" />
      <rect x="28" y="14" width="6" height="12" rx="1" fill="#1e293b" />

      <!-- 4. 8 Gold-Plated Spring Contact Pins Along the Top Ceiling -->
      <g transform="translate(-28, -32)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="8" y1="0" x2="8" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="16" y1="0" x2="16" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="24" y1="0" x2="24" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="32" y1="0" x2="32" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="40" y1="0" x2="40" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="48" y1="0" x2="48" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="56" y1="0" x2="56" y2="12" stroke="url(#poe-gold-pin)" stroke-width="2.2" stroke-linecap="round" />
      </g>

      <!-- 5. Center Snap Point (For Digital RJ45 Patch Cable Simulator) -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    </g>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="1050" height="560" fill="#0b1329" rx="16" />

  <!-- ================================================================= -->
  <!-- MAIN POE SWITCH ENCLOSURE WITH 3D TOP BEVEL                       -->
  <!-- ================================================================= -->
  <g filter="url(#poe-shadow)" transform="translate(45, 60)" id="poe-device-assembly">
    
    <!-- ------------------------------------------------------------- -->
    <!-- 1. TOP STEEL ROOF (3D PERSPECTIVE BEVEL)                      -->
    <!-- ------------------------------------------------------------- -->
    <polygon points="50,0 910,0 960,110 0,110" fill="url(#poe-chassis-top)" stroke="#0f172a" stroke-width="2" />
    <!-- Top Reflection Glare Highlight -->
    <polygon points="120,4 380,4 430,106 140,106" fill="#ffffff" opacity="0.04" />
    <line x1="0" y1="110" x2="960" y2="110" stroke="url(#poe-edge-light)" stroke-width="2.5" />

    <!-- ------------------------------------------------------------- -->
    <!-- 2. FRONT FACEPLATE PANEL                                      -->
    <!-- ------------------------------------------------------------- -->
    <rect x="0" y="110" width="960" height="230" rx="4" fill="url(#poe-chassis-front)" stroke="#090e17" stroke-width="2" />
    <!-- Subtle perimeter rim shadow -->
    <rect x="4" y="114" width="952" height="222" rx="3" fill="none" stroke="#334155" stroke-width="1" opacity="0.5" />

    <!-- Inset Display Bezel Outline (Matching the photo's recessed border) -->
    <rect x="30" y="138" width="900" height="175" rx="8" fill="#090e17" stroke="#1e293b" stroke-width="2" />

    <!-- ------------------------------------------------------------- -->
    <!-- 3. LEFT SECTION: SFP SLOT, GIGABIT POE LOGO & VLAN SWITCH     -->
    <!-- ------------------------------------------------------------- -->
    <!-- SFP Slot Header Text -->
    <text x="125" y="165" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SFP</text>
    
    <!-- SFP Optical Transceiver Cage with Black Rubber Dust Cap -->
    <g class="poe-port-hit" id="port-sfp" data-label="Puerto SFP Fibra Óptica (1.25Gbps)" transform="translate(125, 205)" style="cursor: pointer;">
      <rect x="-42" y="-28" width="84" height="56" rx="4" fill="#090e17" stroke="#334155" stroke-width="2" />
      <rect x="-38" y="-24" width="76" height="48" rx="2" fill="#1e293b" stroke="#020617" stroke-width="1" />
      <!-- Molded Ergonomic Pull Tab on Dust Cap -->
      <rect x="-24" y="-18" width="48" height="36" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
      <ellipse cx="0" cy="0" rx="6" ry="14" fill="#334155" stroke="#1e293b" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    </g>

    <!-- Main Switch Model Title -->
    <text x="175" y="295" font-family="'Outfit', sans-serif" font-size="17" font-weight="900" fill="#ffffff" letter-spacing="0.5">Gigabit POE SWITCH</text>

    <!-- ------------------------------------------------------------- -->
    <!-- 4. VLAN & PWR LEDS + VLAN TOGGLE SLIDER SWITCH                -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(245, 150)">
      
      <!-- VLAN LED -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="6" fill="#090e17" stroke="#334155" stroke-width="1" />
        <circle cx="0" cy="0" r="4" fill="#22c55e" id="poe-led-vlan" filter="url(#poe-led-glow)" />
        <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#cbd5e1" text-anchor="middle">VLAN</text>
      </g>

      <!-- PWR LED -->
      <g transform="translate(32, 0)">
        <circle cx="0" cy="0" r="6" fill="#090e17" stroke="#334155" stroke-width="1" />
        <circle cx="0" cy="0" r="4" fill="#22c55e" id="poe-led-pwr" filter="url(#poe-led-glow)" />
        <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#cbd5e1" text-anchor="middle">PWR</text>
      </g>

      <!-- VLAN Slide Switch (ON / OFF) -->
      <g transform="translate(16, 42)" id="poe-vlan-slider" style="cursor: pointer;">
        <text x="-26" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#cbd5e1" text-anchor="end">ON</text>
        <!-- Switch Outer Recess Track -->
        <rect x="-18" y="-7" width="36" height="14" rx="3" fill="#020617" stroke="#475569" stroke-width="1" />
        <!-- Slider Knob Button (Left = ON, Right = OFF) -->
        <rect x="-16" y="-6" width="16" height="12" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1" id="poe-vlan-knob" />
        <line x1="-8" y1="-3" x2="-8" y2="3" stroke="#f8fafc" stroke-width="1.2" id="poe-vlan-knob-notch" />
        <text x="26" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#cbd5e1" text-anchor="start">OFF</text>
        <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">VLAN</text>
      </g>

    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 5. PORT 1: UP-LINK RJ45 ETHERNET PORT (STANDARD GIGABIT)      -->
    <!-- ------------------------------------------------------------- -->
    <!-- Up-link Status LED (Above Port) -->
    <g transform="translate(370, 150)">
      <circle cx="0" cy="0" r="6" fill="#090e17" stroke="#334155" stroke-width="1" />
      <circle cx="0" cy="0" r="4" fill="#22c55e" id="poe-led-uplink" filter="url(#poe-led-glow)" />
    </g>

    <!-- UP-LINK RJ45 Port Socket -->
    <g class="poe-port-hit" id="port-uplink" data-label="Puerto UP-LINK (Gigabit RJ45)" transform="translate(370, 225)" style="cursor: pointer;">
      <use href="#poe-rj45-port" />
    </g>
    <!-- Label Below Up-link Port -->
    <text x="370" y="295" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">UP-LINK</text>

    <!-- ------------------------------------------------------------- -->
    <!-- 6. PORTS 2 to 5: POE PORTS (1, 2, 3, 4) IN RED BANNER ZONE    -->
    <!-- ------------------------------------------------------------- -->
    <!-- Red Distinctive PoE Banner Container (Matching Photo Exactly) -->
    <g transform="translate(420, 140)">
      <!-- Red Background Box Encapsulating Ports 1 to 4 -->
      <rect x="0" y="0" width="500" height="170" rx="6" fill="url(#poe-red-banner)" stroke="#b91c1c" stroke-width="1.5" />
      
      <!-- 4KV Lightning Surge Protection Symbol on the Right -->
      <g transform="translate(470, 20)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" />
        <path d="M -2 -6 L 2 -1 L -1 0 L 2 6" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <text x="14" y="4" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" fill="#ffffff">4KV</text>
      </g>

      <!-- ----------------------------------------------------------- -->
      <!-- POE PORT 1 (Socket 2 on physical device)                    -->
      <!-- ----------------------------------------------------------- -->
      <g transform="translate(60, 0)">
        <text x="-12" y="25" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
        <circle cx="10" cy="21" r="5.5" fill="#090e17" stroke="#334155" stroke-width="1" />
        <circle cx="10" cy="21" r="3.5" fill="#22c55e" id="poe-led-p1" filter="url(#poe-led-glow)" />

        <g class="poe-port-hit" id="port-poe-1" data-label="Puerto POE 1 (48V / Gigabit)" transform="translate(0, 85)" style="cursor: pointer;">
          <use href="#poe-rj45-port" />
        </g>
      </g>

      <!-- ----------------------------------------------------------- -->
      <!-- POE PORT 2 (Socket 3 on physical device)                    -->
      <!-- ----------------------------------------------------------- -->
      <g transform="translate(170, 0)">
        <text x="-12" y="25" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
        <circle cx="10" cy="21" r="5.5" fill="#090e17" stroke="#334155" stroke-width="1" />
        <circle cx="10" cy="21" r="3.5" fill="#22c55e" id="poe-led-p2" filter="url(#poe-led-glow)" />

        <g class="poe-port-hit" id="port-poe-2" data-label="Puerto POE 2 (48V / Gigabit)" transform="translate(0, 85)" style="cursor: pointer;">
          <use href="#poe-rj45-port" />
        </g>
      </g>

      <!-- ----------------------------------------------------------- -->
      <!-- POE PORT 3 (Socket 4 on physical device)                    -->
      <!-- ----------------------------------------------------------- -->
      <g transform="translate(280, 0)">
        <text x="-12" y="25" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
        <circle cx="10" cy="21" r="5.5" fill="#090e17" stroke="#334155" stroke-width="1" />
        <circle cx="10" cy="21" r="3.5" fill="#22c55e" id="poe-led-p3" filter="url(#poe-led-glow)" />

        <g class="poe-port-hit" id="port-poe-3" data-label="Puerto POE 3 (48V / Gigabit)" transform="translate(0, 85)" style="cursor: pointer;">
          <use href="#poe-rj45-port" />
        </g>
      </g>

      <!-- ----------------------------------------------------------- -->
      <!-- POE PORT 4 (Socket 5 on physical device)                    -->
      <!-- ----------------------------------------------------------- -->
      <g transform="translate(390, 0)">
        <text x="-12" y="25" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
        <circle cx="10" cy="21" r="5.5" fill="#090e17" stroke="#334155" stroke-width="1" />
        <circle cx="10" cy="21" r="3.5" fill="#22c55e" id="poe-led-p4" filter="url(#poe-led-glow)" />

        <g class="poe-port-hit" id="port-poe-4" data-label="Puerto POE 4 (48V / Gigabit)" transform="translate(0, 85)" style="cursor: pointer;">
          <use href="#poe-rj45-port" />
        </g>
      </g>

      <!-- Bracket Line and 'POE Ports' Silk at the Bottom -->
      <g transform="translate(225, 155)">
        <!-- Bracket Line -->
        <path d="M -165 -6 L -165 0 L 165 0 L 165 -6" fill="none" stroke="#ffffff" stroke-width="1.8" />
        <rect x="-45" y="-8" width="90" height="16" fill="#b91c1c" />
        <text x="0" y="4" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">POE Ports</text>
      </g>

    </g>

  </g>

</svg>

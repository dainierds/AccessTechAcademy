<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" class="cable-18-2-svg">
  <defs>
    <!-- Outer PVC Jacket Cylindrical 3D Gradients -->
    <linearGradient id="c18-jacket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="12%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="c18-jacket-inner-cut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Red Conductor Cylindrical 3D Gradient -->
    <linearGradient id="c18-red-wire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="15%" stop-color="#dc2626" />
      <stop offset="35%" stop-color="#f87171" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Black Conductor Cylindrical 3D Gradient -->
    <linearGradient id="c18-black-wire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="15%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="85%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ultra-Realistic Bare Copper Core Multi-Strand Gradient -->
    <linearGradient id="c18-copper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="15%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#fdba74" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="80%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <linearGradient id="c18-copper-tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Nylon Rip Cord Thread Gradient -->
    <linearGradient id="c18-ripcord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Cable Drop Shadow Filter -->
    <filter id="c18-shadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="c18-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Reusable Exposed Copper Conductor Tip with Snap Point -->
    <g id="c18-copper-strands-left">
      <!-- Individual Multi-strand copper filaments -->
      <path d="M 0 0 L -36 -2 L -42 0 L -36 2 Z" fill="url(#c18-copper-grad)" />
      <path d="M 0 -3 L -38 -6 L -44 -4 L -38 -1 Z" fill="url(#c18-copper-grad)" />
      <path d="M 0 3 L -38 6 L -44 4 L -38 1 Z" fill="url(#c18-copper-grad)" />
      <!-- Main copper core body -->
      <path d="M 0 -5 L -38 -5 Q -45 0 -38 5 L 0 5 Z" fill="url(#c18-copper-grad)" stroke="#9a3412" stroke-width="0.8" />
      <ellipse cx="-38" cy="0" rx="3" ry="5" fill="url(#c18-copper-tip)" stroke="#7c2d12" stroke-width="0.8" />
      <!-- Snap Terminal Circle -->
      <circle cx="-42" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
      <circle cx="-42" cy="0" r="3.5" fill="#38bdf8" />
    </g>

    <g id="c18-copper-strands-right">
      <!-- Individual Multi-strand copper filaments -->
      <path d="M 0 0 L 36 -2 L 42 0 L 36 2 Z" fill="url(#c18-copper-grad)" />
      <path d="M 0 -3 L 38 -6 L 44 -4 L 38 -1 Z" fill="url(#c18-copper-grad)" />
      <path d="M 0 3 L 38 6 L 44 4 L 38 1 Z" fill="url(#c18-copper-grad)" />
      <!-- Main copper core body -->
      <path d="M 0 -5 L 38 -5 Q 45 0 38 5 L 0 5 Z" fill="url(#c18-copper-grad)" stroke="#9a3412" stroke-width="0.8" />
      <ellipse cx="38" cy="0" rx="3" ry="5" fill="url(#c18-copper-tip)" stroke="#7c2d12" stroke-width="0.8" />
      <!-- Snap Terminal Circle -->
      <circle cx="42" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
      <circle cx="42" cy="0" r="3.5" fill="#38bdf8" />
    </g>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="1100" height="480" fill="#0b1329" rx="16" />

  <!-- Technical Spec Header Overlay -->
  <g transform="translate(550, 45)" font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text y="0" font-size="16" font-weight="900" fill="#f8fafc" letter-spacing="1">CABLE INDUSTRIAL 18 AWG / 2 CONDUCTORES (18/2)</text>
    <text y="22" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CONTROL DE ACCESO • ALIMENTACIÓN DC 12-24V • CONDUCTORES ROJO (+) Y NEGRO (-)</text>
  </g>

  <!-- ================================================================= -->
  <!-- MAIN CABLE ASSEMBLY (JACKET + 2 CONDUCTORS + COPPER CORE ENDS)    -->
  <!-- ================================================================= -->
  <g filter="url(#c18-shadow)" transform="translate(0, 70)" id="cable-18-2-assembly">
    
    <!-- ------------------------------------------------------------- -->
    <!-- 1. LEFT END CONDUCTORS (PUNTA A: ROJO & NEGRO)                -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(260, 160)">
      
      <!-- RED WIRE (+) LEFT EXTENSION (BENT PROFILE) -->
      <g>
        <!-- Wire Insulation Body -->
        <path d="
          M 0 -12 
          C -40 -12, -75 -42, -125 -42
          L -125 -26
          C -80 -26, -50 -2, 0 -2 Z" 
          fill="url(#c18-red-wire-grad)" stroke="#450a0a" stroke-width="1" />
        
        <!-- Copper Core Emerging from Stripped End -->
        <g class="cable-term-hit" id="term-c18-left-red" data-label="Cable 18/2 (Punta A): Conductor Rojo (+)" transform="translate(-125, -34)" style="cursor: crosshair;">
          <use href="#c18-copper-strands-left" />
        </g>

        <!-- Red Wire Label -->
        <text x="-135" y="-56" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="end">ROJO (+12/24V)</text>
      </g>

      <!-- BLACK WIRE (-) LEFT EXTENSION (BENT PROFILE) -->
      <g>
        <!-- Wire Insulation Body -->
        <path d="
          M 0 2 
          C -50 2, -80 26, -125 26
          L -125 42
          C -75 42, -40 12, 0 12 Z" 
          fill="url(#c18-black-wire-grad)" stroke="#020617" stroke-width="1" />
        
        <!-- Copper Core Emerging from Stripped End -->
        <g class="cable-term-hit" id="term-c18-left-black" data-label="Cable 18/2 (Punta A): Conductor Negro (-)" transform="translate(-125, 34)" style="cursor: crosshair;">
          <use href="#c18-copper-strands-left" />
        </g>

        <!-- Black Wire Label -->
        <text x="-135" y="58" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#94a3b8" text-anchor="end">NEGRO (GND / -)</text>
      </g>

      <!-- Nylon Rip Cord Flared at Left Jacket Opening -->
      <path d="M 0 0 C -15 -8, -25 15, -45 10" fill="none" stroke="url(#c18-ripcord)" stroke-width="1.8" stroke-linecap="round" />
      <text x="-52" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fde047" text-anchor="end">RIP CORD</text>
    </g>


    <!-- ------------------------------------------------------------- -->
    <!-- 2. RIGHT END CONDUCTORS (PUNTA B: ROJO & NEGRO)               -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(840, 160)">
      
      <!-- RED WIRE (+) RIGHT EXTENSION (BENT PROFILE) -->
      <g>
        <!-- Wire Insulation Body -->
        <path d="
          M 0 -12 
          C 40 -12, 75 -42, 125 -42
          L 125 -26
          C 80 -26, 50 -2, 0 -2 Z" 
          fill="url(#c18-red-wire-grad)" stroke="#450a0a" stroke-width="1" />
        
        <!-- Copper Core Emerging from Stripped End -->
        <g class="cable-term-hit" id="term-c18-right-red" data-label="Cable 18/2 (Punta B): Conductor Rojo (+)" transform="translate(125, -34)" style="cursor: crosshair;">
          <use href="#c18-copper-strands-right" />
        </g>

        <!-- Red Wire Label -->
        <text x="135" y="-56" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="start">ROJO (+12/24V)</text>
      </g>

      <!-- BLACK WIRE (-) RIGHT EXTENSION (BENT PROFILE) -->
      <g>
        <!-- Wire Insulation Body -->
        <path d="
          M 0 2 
          C 50 2, 80 26, 125 26
          L 125 42
          C 75 42, 40 12, 0 12 Z" 
          fill="url(#c18-black-wire-grad)" stroke="#020617" stroke-width="1" />
        
        <!-- Copper Core Emerging from Stripped End -->
        <g class="cable-term-hit" id="term-c18-right-black" data-label="Cable 18/2 (Punta B): Conductor Negro (-)" transform="translate(125, 34)" style="cursor: crosshair;">
          <use href="#c18-copper-strands-right" />
        </g>

        <!-- Black Wire Label -->
        <text x="135" y="58" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#94a3b8" text-anchor="start">NEGRO (GND / -)</text>
      </g>

      <!-- Nylon Rip Cord Flared at Right Jacket Opening -->
      <path d="M 0 0 C 15 -8, 25 15, 45 10" fill="none" stroke="url(#c18-ripcord)" stroke-width="1.8" stroke-linecap="round" />
      <text x="52" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fde047" text-anchor="start">RIP CORD</text>
    </g>


    <!-- ------------------------------------------------------------- -->
    <!-- 3. MAIN CENTRAL PVC JACKET SLEEVE WITH PRINTED SILKSCREEN     -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(260, 136)">
      
      <!-- Jacket Outer Shell -->
      <rect x="0" y="0" width="580" height="48" rx="5" fill="url(#c18-jacket-grad)" stroke="#334155" stroke-width="1.5" />
      
      <!-- Left Jacket Cut Lip (3D Ellipse Rim) -->
      <ellipse cx="0" cy="24" rx="6" ry="24" fill="url(#c18-jacket-inner-cut)" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Right Jacket Cut Lip (3D Ellipse Rim) -->
      <ellipse cx="580" cy="24" rx="6" ry="24" fill="url(#c18-jacket-inner-cut)" stroke="#1e293b" stroke-width="1.5" />

      <!-- High-gloss Top Reflection Line -->
      <line x1="12" y1="8" x2="568" y2="8" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />
      <line x1="12" y1="12" x2="568" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-linecap="round" />

      <!-- Laser-Etched Technical Text Silk Along the PVC Jacket -->
      <g transform="translate(30, 29)" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#1e293b" opacity="0.85" letter-spacing="1.2">
        <text x="0" y="0">ACCESS CONTROL CABLE 18 AWG 2/C CMR/CL3R SUN RES DIRECT BURIAL RoHS [00142 FT]</text>
      </g>

      <!-- Dimension Bracket Under Jacket -->
      <g transform="translate(290, 68)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">
        <line x1="-270" y1="0" x2="270" y2="0" stroke="#475569" stroke-width="1.2" />
        <line x1="-270" y1="-5" x2="-270" y2="5" stroke="#475569" stroke-width="1.2" />
        <line x1="270" y1="-5" x2="270" y2="5" stroke="#475569" stroke-width="1.2" />
        <rect x="-85" y="-9" width="170" height="18" fill="#0b1329" />
        <text y="4">CHAQUETA PVC 18/2 AWG</text>
      </g>

    </g>

  </g>

  <!-- Bottom Interactive Connection Helper Badge -->
  <g transform="translate(550, 440)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">
    <rect x="-240" y="-16" width="480" height="28" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    <text y="3" fill="#38bdf8">PUNTAS A Y B: 4 PUNTOS DE CONEXIÓN CON CONTACTOS DE COBRE DESNUDO</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" class="hid-rfid-reader-svg">
  <defs>
    <!-- Matte Textured Polycarbonate & Metallic Gradients -->
    <linearGradient id="rdr-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>

    <linearGradient id="rdr-silver-trim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="rdr-pill-recess" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing LED Light Bar Gradients -->
    <linearGradient id="rdr-led-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="rdr-led-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="25%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="rdr-metal-screw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Filters -->
    <filter id="rdr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="rdr-glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="rdr-key-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Reusable Terminal Pin -->
    <g id="rdr-term-pin">
      <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0b1329" stroke-width="2.5" />
      <circle cx="0" cy="0" r="11" fill="url(#rdr-metal-screw)" stroke="#334155" stroke-width="1" />
      <circle cx="0" cy="0" r="6" fill="#0b1329" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
      <line x1="-4" y1="-2" x2="4" y2="2" stroke="#f8fafc" stroke-width="1.2" />
      <line x1="-2" y1="4" x2="2" y2="-4" stroke="#f8fafc" stroke-width="1.2" />
    </g>
  </defs>

  <!-- Dark Engineering Background Canvas -->
  <rect width="960" height="720" fill="#0b1329" rx="16" />

  <!-- ================================================================= -->
  <!-- LEFT: REALISTIC HID SIGNO / ICLASS KEYPAD READER VIEW             -->
  <!-- ================================================================= -->
  <g filter="url(#rdr-shadow)" transform="translate(60, 40)" id="rdr-physical-reader">
    
    <!-- Outer Silver / Metallic Trim Bezel -->
    <rect x="0" y="0" width="310" height="540" rx="34" fill="url(#rdr-silver-trim)" stroke="#475569" stroke-width="2" />
    <rect x="4" y="4" width="302" height="532" rx="30" fill="#0b1329" />

    <!-- Main Front Textured Matte Polycarbonate Body -->
    <rect x="8" y="8" width="294" height="524" rx="26" fill="url(#rdr-body-grad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Fine Stippling Texture Overlay -->
    <rect x="12" y="12" width="286" height="516" rx="22" fill="#000000" opacity="0.08" />

    <!-- ------------------------------------------------------------- -->
    <!-- 1. TOP HORIZONTAL CURVED LED LIGHTBAR                         -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(35, 36)">
      <!-- Beveled Recess Groove -->
      <rect x="0" y="0" width="240" height="20" rx="10" fill="#090e17" stroke="#334155" stroke-width="1" />
      <!-- Glowing Translucent Diffuser Lens (Red Standby) -->
      <rect x="2" y="2" width="236" height="16" rx="8" fill="url(#rdr-led-red)" id="rdr-lightbar" filter="url(#rdr-glow-red)" />
      <line x1="16" y1="5" x2="224" y2="5" stroke="#ffffff" stroke-width="1.2" opacity="0.7" id="rdr-lightbar-shine" />
    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 2. 12-KEY BACKLIT KEYPAD (4 ROWS OF RECESSED PILLS)           -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(35, 95)" id="rdr-keypad-matrix">
      
      <!-- ROW 1: [ 1 ]  [ 2 ]  [ 3 ] -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="240" height="52" rx="14" fill="url(#rdr-pill-recess)" stroke="#1e293b" stroke-width="1.2" />
        <rect x="2" y="2" width="236" height="48" rx="12" fill="#131d2e" opacity="0.8" />
        
        <!-- Key 1 -->
        <g class="rdr-key" data-key="1" transform="translate(40, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">1</text>
        </g>
        <!-- Key 2 -->
        <g class="rdr-key" data-key="2" transform="translate(120, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">2</text>
        </g>
        <!-- Key 3 -->
        <g class="rdr-key" data-key="3" transform="translate(200, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">3</text>
        </g>
      </g>

      <!-- ROW 2: [ 4 ]  [ 5 ]  [ 6 ] (with tactile bumps) -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="240" height="52" rx="14" fill="url(#rdr-pill-recess)" stroke="#1e293b" stroke-width="1.2" />
        <rect x="2" y="2" width="236" height="48" rx="12" fill="#131d2e" opacity="0.8" />
        
        <!-- Key 4 -->
        <g class="rdr-key" data-key="4" transform="translate(40, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">4</text>
        </g>
        <!-- Key 5 -->
        <g class="rdr-key" data-key="5" transform="translate(120, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">5</text>
          <!-- Center Tactile Dash Marker -->
          <line x1="-6" y1="14" x2="6" y2="14" stroke="#f87171" stroke-width="1.5" opacity="0.6" />
        </g>
        <!-- Key 6 -->
        <g class="rdr-key" data-key="6" transform="translate(200, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">6</text>
        </g>
      </g>

      <!-- ROW 3: [ 7 ]  [ 8 ]  [ 9 ] -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="240" height="52" rx="14" fill="url(#rdr-pill-recess)" stroke="#1e293b" stroke-width="1.2" />
        <rect x="2" y="2" width="236" height="48" rx="12" fill="#131d2e" opacity="0.8" />
        
        <!-- Key 7 -->
        <g class="rdr-key" data-key="7" transform="translate(40, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">7</text>
        </g>
        <!-- Key 8 -->
        <g class="rdr-key" data-key="8" transform="translate(120, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">8</text>
        </g>
        <!-- Key 9 -->
        <g class="rdr-key" data-key="9" transform="translate(200, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">9</text>
        </g>
      </g>

      <!-- ROW 4: [ * ]  [ 0 ]  [ # ] -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="240" height="52" rx="14" fill="url(#rdr-pill-recess)" stroke="#1e293b" stroke-width="1.2" />
        <rect x="2" y="2" width="236" height="48" rx="12" fill="#131d2e" opacity="0.8" />
        
        <!-- Key * -->
        <g class="rdr-key" data-key="*" transform="translate(40, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="8" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">*</text>
        </g>
        <!-- Key 0 -->
        <g class="rdr-key" data-key="0" transform="translate(120, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">0</text>
        </g>
        <!-- Key # -->
        <g class="rdr-key" data-key="#" transform="translate(200, 26)" style="cursor: pointer;">
          <circle cx="0" cy="0" r="18" fill="transparent" />
          <text x="0" y="7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle" filter="url(#rdr-key-glow)">#</text>
        </g>
      </g>

    </g>

    <!-- ------------------------------------------------------------- -->
    <!-- 3. BOTTOM LOGO BADGE: HID                                     -->
    <!-- ------------------------------------------------------------- -->
    <g transform="translate(105, 430)">
      <rect x="0" y="0" width="100" height="34" rx="4" fill="#090e17" stroke="#334155" stroke-width="1" />
      <!-- Silver Embossed HID Letters -->
      <text x="50" y="24" font-family="'Arial Black', 'Impact', sans-serif" font-size="18" font-weight="900" fill="#f1f5f9" text-anchor="middle" letter-spacing="2">HID</text>
    </g>

    <!-- Proximity Symbol Subtitle -->
    <g transform="translate(155, 485)" opacity="0.6">
      <path d="M -12 0 A 12 12 0 0 1 12 0" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M -7 -4 A 7 7 0 0 1 7 -4" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="0" cy="-8" r="1.5" fill="#94a3b8" />
    </g>

  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: 6 CONNECTION TERMINALS (ROJO, NEGRO, BLANCO, VERDE, AZUL, MARRÓN)-->
  <!-- ================================================================= -->
  <g transform="translate(420, 30)">
    
    <!-- Main Wiring Panel Container -->
    <rect x="0" y="0" width="480" height="660" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    
    <!-- Header Box -->
    <rect x="0" y="0" width="480" height="56" rx="16" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    <text x="240" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">BORNES DE CONEXIÓN (6 HILOS WIEGAND)</text>
    <text x="240" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#94a3b8" text-anchor="middle">ALIMENTACIÓN 12VDC + BUS WIEGAND D0/D1 + LÍNEAS LED Y BUZZER</text>

    <!-- ------------------------------------------------------------- -->
    <!-- THE 6 BORNES DE CONEXIÓN EXACTOS SOLICITADOS                  -->
    <!-- ------------------------------------------------------------- -->

    <!-- 1. ROJO (+12VDC POWER) -->
    <g class="rdr-terminal-row" transform="translate(25, 75)">
      <rect x="0" y="0" width="430" height="76" rx="8" fill="#1e293b" stroke="#991b1b" stroke-width="1.5" />
      <g class="rdr-terminal" id="term-rdr-red" data-label="+12V VCC (Rojo)" transform="translate(42, 38)">
        <use href="#rdr-term-pin" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8" />
      </g>
      <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#ef4444">ROJO : +12VDC (VCC)</text>
      <text x="80" y="52" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Alimentación positiva de la lectora (+12V)</text>
      <rect x="320" y="24" width="95" height="28" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
      <text x="367" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">+12V POWER</text>
    </g>

    <!-- 2. NEGRO (GND POWER) -->
    <g class="rdr-terminal-row" transform="translate(25, 165)">
      <rect x="0" y="0" width="430" height="76" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <g class="rdr-terminal" id="term-rdr-blk" data-label="GND Tierra (Negro)" transform="translate(42, 38)">
        <use href="#rdr-term-pin" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.8" />
      </g>
      <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#cbd5e1">NEGRO : GND (0V)</text>
      <text x="80" y="52" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Tierra / Retorno de alimentación y datos</text>
      <rect x="320" y="24" width="95" height="28" rx="4" fill="#0b1329" stroke="#64748b" stroke-width="1" />
      <text x="367" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#e2e8f0" text-anchor="middle">GND (0V)</text>
    </g>

    <!-- 3. BLANCO (DATA 1 WIEGAND) -->
    <g class="rdr-terminal-row" transform="translate(25, 255)">
      <rect x="0" y="0" width="430" height="76" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <g class="rdr-terminal" id="term-rdr-wht" data-label="Data 1 (Blanco)" transform="translate(42, 38)">
        <use href="#rdr-term-pin" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      </g>
      <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#ffffff">BLANCO : Data 1 (D1)</text>
      <text x="80" y="52" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Línea de datos Wiegand Uno (+5V pulsante)</text>
      <rect x="320" y="24" width="95" height="28" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
      <text x="367" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">WIEGAND D1</text>
    </g>

    <!-- 4. VERDE (DATA 0 WIEGAND) -->
    <g class="rdr-terminal-row" transform="translate(25, 345)">
      <rect x="0" y="0" width="430" height="76" rx="8" fill="#1e293b" stroke="#15803d" stroke-width="1.5" />
      <g class="rdr-terminal" id="term-rdr-grn" data-label="Data 0 (Verde)" transform="translate(42, 38)">
        <use href="#rdr-term-pin" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.8" />
      </g>
      <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#22c55e">VERDE : Data 0 (D0)</text>
      <text x="80" y="52" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Línea de datos Wiegand Cero (+5V pulsante)</text>
      <rect x="320" y="24" width="95" height="28" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1" />
      <text x="367" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#86efac" text-anchor="middle">WIEGAND D0</text>
    </g>

    <!-- 5. AZUL (BUZZER / BEEP CONTROL) -->
    <g class="rdr-terminal-row" transform="translate(25, 435)">
      <rect x="0" y="0" width="430" height="76" rx="8" fill="#1e293b" stroke="#1d4ed8" stroke-width="1.5" />
      <g class="rdr-terminal" id="term-rdr-blu" data-label="Buzzer (Azul)" transform="translate(42, 38)">
        <use href="#rdr-term-pin" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
      </g>
      <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#38bdf8">AZUL : Buzzer (BEEP)</text>
      <text x="80" y="52" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Control de zumbador / beeper desde controladora</text>
      <rect x="320" y="24" width="95" height="28" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="367" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#7dd3fc" text-anchor="middle">BUZZER IN</text>
    </g>

    <!-- 6. MARRÓN (LED CONTROL LINE) -->
    <g class="rdr-terminal-row" transform="translate(25, 525)">
      <rect x="0" y="0" width="430" height="76" rx="8" fill="#1e293b" stroke="#78350f" stroke-width="1.5" />
      <g class="rdr-terminal" id="term-rdr-brn" data-label="LED Control (Marrón)" transform="translate(42, 38)">
        <use href="#rdr-term-pin" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#d97706" stroke-width="2" opacity="0.8" />
      </g>
      <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#fbbf24">MARRÓN : LED Control</text>
      <text x="80" y="52" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Línea de conmutación de color LED (Verde / Rojo)</text>
      <rect x="320" y="24" width="95" height="28" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1" />
      <text x="367" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#fde68a" text-anchor="middle">LED CONTROL</text>
    </g>

    <!-- Bottom Pinout Legend -->
    <text x="240" y="635" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">
      PROTOCOLO WIEGAND 26/34-BIT • HID iCLASS SE / BLE / NFC COMPATIBLE
    </text>
  </g>

</svg>

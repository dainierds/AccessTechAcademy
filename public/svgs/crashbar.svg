<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" class="von-duprin-crashbar-svg">
  <defs>
    <linearGradient id="cb-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cb-rail-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="15%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cb-pushpad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="10%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="90%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cb-latch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cb-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="cb-pad-shadow" x="-2%" y="-5%" width="104%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="cb-led-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <g id="cb-allen-screw">
      <circle cx="0" cy="0" r="7" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#0f172a" />
    </g>
  </defs>

  <g filter="url(#cb-shadow)" transform="translate(45, 45)" id="crashbar-mechanism-assembly">
    <g id="cb-latch-bolt" transform="translate(0, 0)">
      <path d="M 38 100 L 8 110 L 8 145 L 38 155 Z" fill="url(#cb-latch-grad)" stroke="#0f172a" stroke-width="1.5" />
      <path d="M 8 110 L 2 114 L 2 141 L 8 145 Z" fill="#475569" />
      <rect x="18" y="158" width="16" height="12" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
    </g>

    <g transform="translate(130, 48)">
      <rect x="0" y="0" width="720" height="74" rx="3" fill="url(#cb-rail-grad)" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="2" x2="720" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
      <line x1="0" y1="8" x2="720" y2="8" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
      <line x1="0" y1="72" x2="720" y2="72" stroke="#334155" stroke-width="1.5" />
      <circle cx="505" cy="46" r="4.5" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <circle cx="505" cy="46" r="2.5" fill="#1e293b" />
    </g>

    <g id="cb-pushpad-group" filter="url(#cb-pad-shadow)" transform="translate(135, 62)">
      <path d="M 12 0 L 24 0 L 24 82 L 12 82 A 6 6 0 0 1 6 76 L 6 6 A 6 6 0 0 1 12 0 Z" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      <rect x="24" y="0" width="460" height="82" rx="4" fill="url(#cb-pushpad-grad)" stroke="#334155" stroke-width="1.2" />
      <path d="M 24 2 L 484 2 L 484 14 L 24 14 Z" fill="#ffffff" opacity="0.8" />
      <line x1="24" y1="22" x2="484" y2="22" stroke="#ffffff" stroke-width="0.8" opacity="0.5" />
      <line x1="24" y1="64" x2="484" y2="64" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
      <line x1="24" y1="80" x2="484" y2="80" stroke="#475569" stroke-width="1.5" />
      <path d="M 484 0 L 490 0 A 4 4 0 0 1 494 4 L 494 78 A 4 4 0 0 1 490 82 L 484 82 Z" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      <text x="254" y="46" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#475569" opacity="0.6" letter-spacing="4" text-anchor="middle">PUSH TO EXIT</text>
    </g>

    <g transform="translate(30, 0)">
      <path d="M 12 28 A 12 12 0 0 1 24 16 L 90 16 A 12 12 0 0 1 102 28 L 114 96 L 102 216 A 12 12 0 0 1 90 228 L 24 228 A 12 12 0 0 1 12 216 Z" fill="url(#cb-head-grad)" stroke="#334155" stroke-width="2" />
      <path d="M 22 28 L 84 28 L 94 96 L 84 216 L 22 216 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
      <line x1="12" y1="124" x2="108" y2="124" stroke="#64748b" stroke-width="1.5" opacity="0.6" />
      <use href="#cb-allen-screw" xlink:href="#cb-allen-screw" x="30" y="44" />
      <use href="#cb-allen-screw" xlink:href="#cb-allen-screw" x="30" y="200" />
      <g transform="translate(74, 124)">
        <circle cx="0" cy="0" r="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4" fill="#22c55e" id="cb-el-led" filter="url(#cb-led-glow)" />
      </g>
      <text x="56" y="96" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">VON DUPRIN</text>
      <text x="56" y="108" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#334155" text-anchor="middle">75 / 99 SERIES</text>
      <text x="56" y="145" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#059669" text-anchor="middle" id="cb-status-text">LATCHED</text>
    </g>

    <g transform="translate(850, 44)">
      <path d="M 0 4 L 18 0 L 26 8 L 26 74 L 18 82 L 0 78 Z" fill="url(#cb-head-grad)" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="5" x2="18" y2="1" stroke="#ffffff" stroke-width="1" />
      <line x1="18" y1="0" x2="18" y2="82" stroke="#64748b" stroke-width="1" />
      <circle cx="10" cy="41" r="3.5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    </g>
  </g>
</svg>
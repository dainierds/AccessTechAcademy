<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" class="camden-cx12-relay-svg">
  <defs>
    
    <linearGradient id="cx-case-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="cx-bevel-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="15%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    
    <linearGradient id="cx-pcb-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    
    <linearGradient id="cx-termblock-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="25%" stop-color="#16a34a" />
      <stop offset="75%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <linearGradient id="cx-metal-screw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    
    <radialGradient id="cx-pot-hole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    
    <filter id="cx-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="cx-led-glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    
    <g id="cx-screw-terminal">
      <rect x="-24" y="-20" width="48" height="40" rx="3" fill="none" />
      
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="0" cy="0" r="11" fill="url(#cx-metal-screw)" stroke="#334155" stroke-width="1" />
      
      <circle cx="0" cy="0" r="5.5" fill="#0f172a" />
      
      <line x1="-4" y1="-2" x2="4" y2="2" stroke="#f8fafc" stroke-width="1.2" />
      <line x1="-2" y1="4" x2="2" y2="-4" stroke="#f8fafc" stroke-width="1.2" />
    </g>

    
    <g id="cx-potentiometer">
      <circle cx="0" cy="0" r="26" fill="url(#cx-pot-hole)" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="0" cy="0" r="16" fill="#ca8a04" stroke="#713f12" stroke-width="1" />
      
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#451a03" stroke-width="2" />
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#451a03" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
  </defs>

  
  

  
  
  

<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <defs>
    
    <filter id="caseShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    
    <linearGradient id="bracketMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    
    <linearGradient id="bodyFaceplate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>

    
    <linearGradient id="altronixRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    
    <radialGradient id="screwHole" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  
  <rect x="15" y="10" width="290" height="340" rx="10" fill="url(#bracketMetal)" stroke="#94a3b8" stroke-width="1.5" filter="url(#caseShadow)" />

  
  <rect x="135" y="18" width="50" height="14" rx="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
  <rect x="135" y="328" width="50" height="14" rx="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />

  
  <circle cx="28" cy="180" r="8" fill="url(#screwHole)" stroke="#64748b" stroke-width="1" />
  <circle cx="292" cy="180" r="8" fill="url(#screwHole)" stroke="#64748b" stroke-width="1" />

  
  <rect x="15" y="40" width="220" height="280" rx="8" fill="url(#bodyFaceplate)" stroke="#475569" stroke-width="2" />

  <!-- Logo Altronix Header -->
  <rect x="25" y="55" width="200" height="60" rx="6" fill="#111" stroke="#333" stroke-width="1" />
  <rect x="30" y="60" width="190" height="24" rx="4" fill="url(#altronixRed)" />
  
  <text x="38" y="77" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">Altronix</text>
  <circle cx="188" cy="72" r="5" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="186" y="75" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#ffffff">R</text>

  <text x="35" y="102" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" letter-spacing="0.5">AL175</text>
  <text x="110" y="101" font-family="Arial, sans-serif" font-weight="normal" font-size="9" fill="#94a3b8">Power Supply / Charger</text>

  <!-- Información técnica -->
  <text x="35" y="140" font-family="Courier New, monospace" font-size="8.5" fill="#94a3b8">Input: 115VAC 60Hz</text>
  <text x="35" y="156" font-family="Courier New, monospace" font-size="8.5" fill="#94a3b8">Output: 12VDC / 24VDC</text>
  <text x="35" y="172" font-family="Courier New, monospace" font-size="8.5" fill="#94a3b8">Continuous: 1.75A</text>

  <!-- SELECTOR / SWITCH CONMUTADOR 12V / 24V -->
  <g transform="translate(35, 195)">
    <rect x="0" y="0" width="120" height="42" rx="5" fill="#090e17" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#f59e0b">12V</text>
    <text x="104" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="end">24V</text>
    
    <!-- Switch Slider -->
    <rect x="36" y="6" width="48" height="30" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="42" y="9" width="18" height="24" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
  </g>
  
  <text x="35" y="275" font-family="Arial, sans-serif" font-size="7.5" fill="#64748b">Access Control System Unit</text>
  <text x="35" y="288" font-family="Arial, sans-serif" font-size="7.5" fill="#64748b">Brooklyn, NY, U.S.A.</text>
  <text x="35" y="308" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#64748b">CE</text>

  <!-- BORNERA VERDE COMPACTA: SOLO ROJO (+) Y NEGRO (-) -->
  <rect x="235" y="120" width="56" height="110" rx="4" fill="#15803d" stroke="#166534" stroke-width="1.5" />
  <rect x="242" y="126" width="42" height="98" rx="2" fill="#0f172a" stroke="#020617" stroke-width="1" />

  <!-- Borne 1: ROJO (+) -->
  <g transform="translate(244, 136)">
    <rect x="0" y="0" width="38" height="32" rx="2" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="19" cy="16" r="9" fill="url(#bracketMetal)" stroke="#b91c1c" stroke-width="1" />
    <circle cx="19" cy="16" r="4" fill="#ef4444" />
    <line x1="13" y1="16" x2="25" y2="16" stroke="#0f172a" stroke-width="1.8" />
  </g>

  <!-- Borne 2: NEGRO (GND / -) -->
  <g transform="translate(244, 180)">
    <rect x="0" y="0" width="38" height="32" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="19" cy="16" r="9" fill="url(#bracketMetal)" stroke="#334155" stroke-width="1" />
    <circle cx="19" cy="16" r="4" fill="#020617" />
    <line x1="13" y1="16" x2="25" y2="16" stroke="#0f172a" stroke-width="1.8" />
  </g>
</svg>

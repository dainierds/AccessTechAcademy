<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="1080" height="240" class="maglock-lateral-svg">
  <defs>
    <!-- Gradientes Aluminio Anodizado Maglock -->
    <linearGradient id="mll-alum-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="15%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="mll-top-bracket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="mll-steel-pole-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="mll-dark-resin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="mll-termblock-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="mll-screw-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Filtros de Sombra y Brillo LED -->
    <filter id="mll-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="mll-led-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <g id="mll-phillips-screw">
      <circle cx="0" cy="0" r="10" fill="url(#mll-screw-metal)" stroke="#334155" stroke-width="1.2" />
      <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Celda de Borne Lateral -->
    <g id="mll-terminal-cell">
      <rect x="0" y="0" width="138" height="66" rx="8" fill="url(#mll-termblock-grad)" stroke="#334155" stroke-width="1.5" />
      <!-- Tornillo de conexión -->
      <g transform="translate(108, 33)">
        <circle cx="0" cy="0" r="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="0" cy="0" r="13" fill="url(#mll-screw-metal)" stroke="#475569" stroke-width="1" />
        <circle cx="0" cy="0" r="6.5" fill="#090e17" />
        <line x1="-5" y1="-3" x2="5" y2="3" stroke="#f8fafc" stroke-width="1.4" />
        <line x1="-3" y1="5" x2="3" y2="-5" stroke="#f8fafc" stroke-width="1.4" />
      </g>
    </g>
  </defs>

  <g transform="translate(10, 10)">
    <g filter="url(#mll-shadow)">
      
      <!-- 1. SOPORTE SUPERIOR (Top Bracket) -->
      <rect x="0" y="0" width="900" height="56" rx="4" fill="url(#mll-top-bracket-grad)" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="12" x2="900" y2="12" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="36" x2="900" y2="36" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
      <line x1="0" y1="55" x2="900" y2="55" stroke="#334155" stroke-width="1.5" />

      <circle cx="34" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="68" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="110" y="16" width="70" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect x="114" y="20" width="62" height="12" rx="6" fill="#0b1329" />
      <rect x="290" y="18" width="22" height="16" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <circle cx="430" cy="26" r="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="460" y="16" width="70" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect x="464" y="20" width="62" height="12" rx="6" fill="#0b1329" />
      <rect x="560" y="18" width="22" height="16" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <rect x="660" y="16" width="38" height="20" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="780" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="814" cy="22" r="5" fill="#1e293b" stroke="#475569" stroke-width="1" />

      <!-- 2. CUERPO DE LA CERRADURA MAGNÉTICA (Maglock Body) -->
      <rect x="0" y="56" width="900" height="165" fill="url(#mll-alum-grad)" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="58" x2="900" y2="58" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
      <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff" stroke-width="0.5" opacity="0.4" />
      <line x1="0" y1="140" x2="900" y2="140" stroke="#f1f5f9" stroke-width="0.5" opacity="0.3" />
      <line x1="0" y1="220" x2="900" y2="220" stroke="#475569" stroke-width="1.5" />

      <use href="#mll-phillips-screw" xlink:href="#mll-phillips-screw" x="18" y="140" />

      <!-- Núcleo Electromagnético Bobinado -->
      <g transform="translate(32, 68)">
        <rect x="0" y="0" width="620" height="142" rx="3" fill="url(#mll-dark-resin)" stroke="#020617" stroke-width="2" />
        <rect x="38" y="10" width="544" height="16" fill="url(#mll-steel-pole-grad)" stroke="#1e293b" stroke-width="0.8" />
        <line x1="38" y1="12" x2="582" y2="12" stroke="#ffffff" stroke-width="1" />
        <rect x="38" y="26" width="544" height="20" fill="url(#mll-dark-resin)" />
        <rect x="38" y="46" width="544" height="50" fill="url(#mll-steel-pole-grad)" stroke="#1e293b" stroke-width="1" />
        <line x1="38" y1="50" x2="582" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
        <line x1="38" y1="71" x2="582" y2="71" stroke="#cbd5e1" stroke-width="0.8" opacity="0.6" />
        <line x1="38" y1="94" x2="582" y2="94" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" />
        <rect x="38" y="96" width="544" height="20" fill="url(#mll-dark-resin)" />
        <rect x="38" y="116" width="544" height="16" fill="url(#mll-steel-pole-grad)" stroke="#1e293b" stroke-width="0.8" />
        <line x1="38" y1="118" x2="582" y2="118" stroke="#ffffff" stroke-width="1" />
      </g>

      <!-- Panel Frontal Derecho: Serigrafía y LED de Estado -->
      <g transform="translate(654, 56)">
        <rect x="0" y="0" width="246" height="165" fill="url(#mll-alum-grad)" stroke="#334155" stroke-width="1" />
        <line x1="0" y1="0" x2="0" y2="165" stroke="#1e293b" stroke-width="2" />
        <line x1="2" y1="0" x2="2" y2="165" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        <use href="#mll-phillips-screw" xlink:href="#mll-phillips-screw" x="228" y="84" />

        <g transform="translate(18, 52)">
          <path d="M 6 0 A 14 14 0 0 1 6 24" fill="none" stroke="#0b1329" stroke-width="2.5" stroke-linecap="round" />
          <path d="M 12 4 A 9 9 0 0 1 12 20" fill="none" stroke="#0b1329" stroke-width="2.2" stroke-linecap="round" />
          <path d="M 18 8 A 4 4 0 0 1 18 16" fill="none" stroke="#0b1329" stroke-width="2" stroke-linecap="round" />
        </g>

        <text x="44" y="58" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#0b1329" letter-spacing="1">SECURITRON</text>
        <text x="44" y="72" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" font-style="italic" fill="#0b1329" letter-spacing="1">MAGLOCK</text>
        
        <line x1="16" y1="84" x2="148" y2="84" stroke="#0b1329" stroke-width="1.2" />
        <text x="16" y="104" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="900" fill="#0b1329" letter-spacing="1.5">ASSA ABLOY</text>
        <text x="16" y="122" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#475569">600 LBS / 12-24VDC</text>
        <text x="16" y="136" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748b">FAIL-SAFE ELECTROMAGNETIC</text>

        <g transform="translate(182, 38)">
          <circle cx="0" cy="0" r="7" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
          <circle cx="0" cy="0" r="4.5" fill="#22c55e" id="mll-bond-led" filter="url(#mll-led-glow)" />
          <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="800" fill="#0b1329" text-anchor="middle">STATUS</text>
        </g>
      </g>

      <!-- 3. EXTENSIÓN LATERAL DERECHA: REGLETA 2 PUNTOS DE CONEXIÓN (+ / -) -->
      <rect x="900" y="30" width="160" height="180" rx="10" fill="#090e17" stroke="#1e293b" stroke-width="2" />
      <path d="M 900 45 L 915 45 L 915 195 L 900 195 Z" fill="#1e293b" opacity="0.6" />

      <!-- Borne 1: Positivo (+12V/+24V) -->
      <g transform="translate(910, 42)">
        <use href="#mll-terminal-cell" xlink:href="#mll-terminal-cell" />
        <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#ef4444">+ (POS)</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fca5a5">+12V / +24VDC</text>
      </g>

      <!-- Borne 2: Negativo (GND / 0V) -->
      <g transform="translate(910, 126)">
        <use href="#mll-terminal-cell" xlink:href="#mll-terminal-cell" />
        <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#cbd5e1">- (NEG)</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94a3b8">GND / COM (-) </text>
      </g>

    </g>
  </g>
</svg>

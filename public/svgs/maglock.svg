    <rect x="0" y="56" width="900" height="165" fill="url(#ml-alum-grad)" stroke="#334155" stroke-width="1.5" />
    
    
    <line x1="0" y1="58" x2="900" y2="58" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
    <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff" stroke-width="0.5" opacity="0.4" />
    <line x1="0" y1="140" x2="900" y2="140" stroke="#f1f5f9" stroke-width="0.5" opacity="0.3" />
    <line x1="0" y1="220" x2="900" y2="220" stroke="#475569" stroke-width="1.5" />

    
    <use href="#ml-phillips-screw" xlink:href="#ml-phillips-screw" x="18" y="140" />

    
    
    
    <g transform="translate(32, 68)">
      
      <rect x="0" y="0" width="620" height="142" rx="3" fill="url(#ml-dark-resin)" stroke="#020617" stroke-width="2" />
      
      

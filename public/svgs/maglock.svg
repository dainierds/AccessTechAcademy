      <line x1="16" y1="84" x2="148" y2="84" stroke="#0b1329" stroke-width="1.2" />

      
      <text x="16" y="104" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="900" fill="#0b1329" letter-spacing="1.5"></text>

      
      <text x="16" y="122" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#475569">600 LBS / 12-24VDC</text>
      <text x="16" y="136" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748b">FAIL-SAFE ELECTROMAGNETIC</text>

      
      <g transform="translate(182, 38)">

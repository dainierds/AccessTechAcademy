<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" class="maglock-svg">
  <defs>
    
    <linearGradient id="ml-alum-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="15%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="ml-top-bracket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="ml-steel-pole-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="ml-dark-resin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="ml-metal-screw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    
    <filter id="ml-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="ml-led-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    
    <g id="ml-phillips-screw">
      <circle cx="0" cy="0" r="10" fill="url(#ml-metal-screw)" stroke="#334155" stroke-width="1.2" />
      <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    </g>

    
    <g id="ml-terminal-node">
      <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0b1329" stroke-width="2.5" />
      <circle cx="0" cy="0" r="11" fill="url(#ml-metal-screw)" stroke="#334155" stroke-width="1" />
      <circle cx="0" cy="0" r="6" fill="#0b1329" />
      
      <line x1="-4" y1="-2" x2="4" y2="2" stroke="#f8fafc" stroke-width="1.2" />
      <line x1="-2" y1="4" x2="2" y2="-4" stroke="#f8fafc" stroke-width="1.2" />

function testSvg(key, canvasId, w, h) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const svg = svgs[key];
  
  try {
    const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    
    img.onload = function() {
      log('[' + key + '] img.onload fired! naturalWidth=' + img.naturalWidth + ' naturalHeight=' + img.naturalHeight + ' complete=' + img.complete, true);
      try {
        ctx.drawImage(img, 0, 0, w, h);
        log('[' + key + '] ctx.drawImage() called successfully', true);
      } catch(e) {
        log('[' + key + '] ctx.drawImage() ERROR: ' + e.message, false);
      }
      URL.revokeObjectURL(url);
    };
    
    img.onerror = function(e) {
      log('[' + key + '] img.onerror fired! SVG blob failed to load', false);
      URL.revokeObjectURL(url);
    };
    
    log('[' + key + '] Setting img.src to blob URL...', true);
    img.src = url;
    
    log('[' + key + '] After src assignment: img.complete=' + img.complete + ' naturalWidth=' + img.naturalWidth, img.complete);
    
  } catch(e) {
    log('[' + key + '] Exception: ' + e.message, false);
  }
}
